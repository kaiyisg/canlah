name: verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: dependency policy (L-076)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=""
          python3 scripts/ci/test_dep_policy_check.py
          python3 scripts/ci/dep_policy_check.py ${BASE:+--base "$BASE"}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run verify

